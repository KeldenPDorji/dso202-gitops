# =============================================================================
# File        : cluster/kind-cluster.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Practical 1 cluster, reused unchanged except for the name
# Purpose     : The three-node kind cluster every task runs on. Host port 30080
#               is mapped so the dev frontend is reachable at
#               http://localhost:30080 without a port-forward.
#
# Staging uses NodePort 30081, which is deliberately NOT mapped here: the
# brief reaches staging through kubectl port-forward instead, which keeps the
# two environments distinguishable from the host.
# =============================================================================
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: dso202-gitops

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  apiServerAddress: "127.0.0.1"

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

  - role: worker
    image: kindest/node:v1.36.1
    labels:
      dso202/node-role: worker
      dso202/node-index: "1"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1

  - role: worker
    image: kindest/node:v1.36.1
    labels:
      dso202/node-role: worker
      dso202/node-index: "2"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
