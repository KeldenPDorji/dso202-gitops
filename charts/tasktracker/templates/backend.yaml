{{- /*
=============================================================================
File        : charts/tasktracker/templates/backend.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit IV 4.3.2 (sync waves), 4.3.3 (health checks); Unit III 3.2
Purpose     : The API tier and its ClusterIP Service.

Contract    : C2 backend.extraEnv adds a variable without touching a template
              C3 credentials come from existingSecret
              C4 readiness probe on GET /api/status
              C5 sync-wave "1": after the database is Healthy
              C6 progressDeadlineSeconds 120, so a failed rollout is reported
                 as Degraded in two minutes rather than the default ten
=============================================================================
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-backend" (include "tasktracker.fullname" .) }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "tasktracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-backend" (include "tasktracker.fullname" .) }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # C6 - the Kubernetes default is 600 seconds. Task 7 depends on a failed
  # rollout being visible quickly.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: backend
          image: {{ include "tasktracker.image" (dict "root" $ "tier" .Values.backend) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key := list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            {{- if not (hasKey $.Values.backend.extraEnv $key) }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- range $key := list "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $key }}
            {{- end }}
            {{- /* C2 - anything added under backend.extraEnv appears here. */}}
            {{- range $k, $v := .Values.backend.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # C4 - /api/status only answers once the database connection is open,
          # so readiness here means the whole path backend -> database works.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
