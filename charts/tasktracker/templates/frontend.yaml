{{- /*
=============================================================================
File        : charts/tasktracker/templates/frontend.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit IV 4.3.2 (sync waves), 4.3.3 (health checks); Unit III 3.2
Purpose     : The page tier and the Service that exposes it.

Contract    : C5  sync-wave "2": last, after the backend is Healthy
              C6  progressDeadlineSeconds 120
              C9  no Ingress template exists; no controller is installed here
              C10 Service type and node port are values: 30080 dev, 30081 staging

nodePort is emitted only when the type is NodePort AND a port is given, so a
ClusterIP release renders a Service the API server will accept.
=============================================================================
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-frontend" (include "tasktracker.fullname" .) }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "tasktracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-frontend" (include "tasktracker.fullname" .) }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: frontend
          image: {{ include "tasktracker.image" (dict "root" $ "tier" .Values.frontend) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tasktracker.fullname" . }}
                  key: BACKEND_URL
            {{- range $k, $v := .Values.frontend.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # C4 - nginx serves the page only after the entrypoint has rendered
          # BACKEND_URL into config.js, so a 200 here means the page is complete.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
